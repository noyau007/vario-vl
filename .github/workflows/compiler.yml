# Compile l'application à chaque envoi sur GitHub (ou à la demande, onglet Actions) et fournit VarioVL.ipa.
name: Compiler Vario VL
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les calculs
        run: |
          swiftc -O VarioVL/Calculs.swift Verification/main.swift -o verification
          ./verification
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Générer le projet Xcode
        run: xcodegen generate
      - name: Compiler pour iPhone (sans signature)
        run: |
          xcodebuild -project VarioVL.xcodeproj -scheme VarioVL -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Fabriquer VarioVL.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VarioVL.app Payload/
          zip -qry VarioVL.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VarioVL-ipa
          path: VarioVL.ipa
          retention-days: 30
