# Projet Xcode décrit en texte : XcodeGen le transforme en VarioVL.xcodeproj (fait par la compilation automatique).
name: VarioVL
options:
  bundleIdPrefix: fr.planifvol
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VarioVL:
    type: application
    platform: iOS
    sources:
      - path: VarioVL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.planifvol.vario
    info:
      path: VarioVL/Info.plist
      properties:
        CFBundleDisplayName: Vario VL
        UILaunchScreen: {}
        UIBackgroundModes: [audio, location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMotionUsageDescription: "Le baromètre sert à mesurer la vitesse verticale (vario) et l'altitude."
        NSLocationWhenInUseUsageDescription: "Le GPS donne la vitesse sol, le cap et sert à caler l'altimètre."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Le GPS continue écran verrouillé pendant le vol."
schemes:
  VarioVL:
    build:
      targets:
        VarioVL: all
